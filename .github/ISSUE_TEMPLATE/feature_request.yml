name: Feature request
description: Suggest an improvement, new conversion, or product capability for Convertix.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Convertix. Describe the problem first, then the solution you have in mind.

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user problem would this solve?
      placeholder: Explain the use case and why it matters.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or experience you would like to see.
    validations:
      required: true

  - type: input
    id: conversion
    attributes:
      label: New conversion or format
      description: If this is a format request, specify the source and target formats.
      placeholder: e.g. HEIC -> JPG

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Conversion formats
        - Web frontend
        - API
        - Worker / conversion engine
        - Accounts / database
        - Performance / scaling
        - Privacy / security
        - Developer experience / CI
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Mention workarounds or other approaches you considered.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for similar requests.
          required: true
