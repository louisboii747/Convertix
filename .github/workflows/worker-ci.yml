name: Worker CI

on:
  push:
    branches: [master]
    paths:
      - "services/worker/**"
      - ".github/workflows/worker-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "services/worker/**"
      - ".github/workflows/worker-ci.yml"

permissions:
  contents: read

concurrency:
  group: worker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/worker/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Import worker module
        env:
          AWS_DEFAULT_REGION: eu-west-2
        run: python -c "import worker"

      - name: Run tests with coverage
        env:
          AWS_DEFAULT_REGION: eu-west-2
        run: pytest --cov=worker --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-coverage
          path: services/worker/coverage.xml
          if-no-files-found: error
