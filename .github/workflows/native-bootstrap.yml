name: Native app bootstrap validation

on:
  push:
    branches:
      - chore/native-app-scaffold

permissions:
  contents: write

jobs:
  android:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Generate Gradle wrapper
        working-directory: apps/android
        run: gradle wrapper --gradle-version 9.6.1 --distribution-type bin
      - name: Validate Android build
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Commit Gradle wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/android/gradlew apps/android/gradlew.bat apps/android/gradle/wrapper
          git diff --cached --quiet || git commit -m "chore: add Android Gradle wrapper"
          git push origin HEAD:chore/native-app-scaffold

  apple:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Xcode project
        run: xcodebuild -project apps/apple/Convertix.xcodeproj -list
      - name: Build iOS target
        run: xcodebuild -project apps/apple/Convertix.xcodeproj -target "Convertix iOS" -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Build macOS target
        run: xcodebuild -project apps/apple/Convertix.xcodeproj -target "Convertix macOS" -configuration Debug CODE_SIGNING_ALLOWED=NO build
